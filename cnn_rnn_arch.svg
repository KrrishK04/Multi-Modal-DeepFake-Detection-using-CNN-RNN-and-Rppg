<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#333">CNN-RNN Model Architecture</text>
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#666">Spatio-Temporal Detection</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="150" height="100" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2" rx="5" ry="5" filter="url(#shadow)"/>
    <rect x="5" y="-5" width="150" height="100" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2" rx="5" ry="5" filter="url(#shadow)"/>
    <rect x="10" y="-10" width="150" height="100" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2" rx="5" ry="5" filter="url(#shadow)"/>
    <text x="85" y="45" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#1E88E5">Input Video</text>
    <text x="85" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">(Frame Sequence)</text>
  </g>

  <g transform="translate(280, 250)">
    <rect x="0" y="0" width="150" height="100" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="2" rx="5" ry="5" filter="url(#shadow)"/>
    <text x="75" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#388E3C">Preprocessing</text>
    <text x="75" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#388E3C">Face Detection</text>
    <text x="75" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#388E3C">&amp; Cropping</text>
  </g>

  <g transform="translate(510, 250)">
    <rect x="0" y="0" width="150" height="100" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="5" ry="5" filter="url(#shadow)"/>
    <text x="75" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#F57C00">Spatial Module</text>
    <text x="75" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#F57C00">(ResNeXt-50)</text>
    <text x="75" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#F57C00">CNN</text>
  </g>

  <g transform="translate(740, 250)">
    <rect x="0" y="0" width="150" height="100" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="5" ry="5" filter="url(#shadow)"/>
    <text x="75" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#F57C00">Temporal Module</text>
    <text x="75" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#F57C00">(LSTM)</text>
    <text x="75" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#F57C00">RNN</text>
  </g>

  <g transform="translate(970, 250)">
    <rect x="0" y="0" width="150" height="100" fill="#FCE4EC" stroke="#EC407A" stroke-width="2" rx="5" ry="5" filter="url(#shadow)"/>
    <text x="75" y="45" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#C2185B">Prediction</text>
    <text x="75" y="70" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#C2185B">Real / Fake</text>
  </g>

  <path d="M210 300 L280 300" stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M430 300 L510 300" stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="470" y="290" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555">Face Crops</text>
  <path d="M660 300 L740 300" stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="700" y="290" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555">Feature Vectors</text>
  <path d="M890 300 L970 300" stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <!-- <text x="930" y="290" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555">Logits</text> -->
</svg>