<svg viewBox="80 160 1610 840" xmlns="http://www.w3.org/2000/svg">
  <!-- The background rect has been removed for transparency -->
  
  <!-- Commented out titles -->
  <!-- <text x="900" y="50" font-family="Arial, sans-serif" font-size="38" text-anchor="middle" font-weight="bold" fill="#333">
    Multi-Modal Deepfake Detection Full System Architecture
  </text> -->
  <!-- <text x="900" y="85" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#666">
    Integrating Spatio-Temporal, Physiological, and Fusion Modules
  </text> -->

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="3" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Input + Preprocessing -->
  <g filter="url(#shadow)">
    <rect x="100" y="200" width="220" height="110" fill="#D4E6F1" stroke="#5DADE2" stroke-width="2.5" rx="8" ry="8"/>
    <text x="210" y="265" font-size="22" text-anchor="middle" font-weight="bold" fill="#2E86C1">Input Video</text>

    <rect x="100" y="400" width="220" height="150" fill="#D5F5E3" stroke="#58D68D" stroke-width="2.5" rx="8" ry="8"/>
    <text x="210" y="445" font-size="20" text-anchor="middle" font-weight="bold" fill="#239B56">Preprocessing</text>
    <text x="210" y="485" font-size="18" text-anchor="middle" fill="#239B56">Frame Splitting</text>
    <text x="210" y="515" font-size="18" text-anchor="middle" fill="#239B56">Face Detection</text>
  </g>
  <path d="M210 310 L210 400" stroke="#444" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- CNN-RNN Stream -->
  <g filter="url(#shadow)">
    <rect x="420" y="180" width="580" height="380" fill="#FEF9E7" stroke="#F8C471" stroke-width="2.5" rx="8" ry="8"/>
    <text x="710" y="215" font-size="20" text-anchor="middle" fill="#BA4A00">Spatio-Temporal Analysis Stream</text>
    
    <rect x="440" y="250" width="250" height="140" fill="#FAD7A0" stroke="#F39C12" stroke-width="2" rx="5" ry="5"/>
    <text x="565" y="300" font-size="18" text-anchor="middle" font-weight="bold" fill="#AF601A">Spatial Feature Extractor</text>
    <text x="565" y="330" font-size="16" text-anchor="middle" fill="#AF601A">(ResNeXt-50 CNN)</text>
    
    <rect x="730" y="250" width="250" height="140" fill="#FAD7A0" stroke="#F39C12" stroke-width="2" rx="5" ry="5"/>
    <text x="855" y="300" font-size="18" text-anchor="middle" font-weight="bold" fill="#AF601A">Temporal Aggregator</text>
    <text x="855" y="330" font-size="16" text-anchor="middle" fill="#AF601A">(LSTM)</text>
    
    <rect x="585" y="440" width="250" height="90" fill="#F5B7B1" stroke="#E74C3C" stroke-width="2" rx="5" ry="5"/>
    <text x="710" y="485" font-size="18" text-anchor="middle" font-weight="bold" fill="#943126">Visual Prediction (Pv, Cv)</text>
  </g>
  
  <!-- rPPG Stream -->
  <g filter="url(#shadow)">
    <rect x="420" y="600" width="580" height="380" fill="#EBF5FB" stroke="#85C1E9" stroke-width="2.5" rx="8" ry="8"/>
    <text x="710" y="635" font-size="20" text-anchor="middle" fill="#2874A6">Physiological Analysis Stream (rPPG)</text>

    <rect x="440" y="670" width="250" height="120" fill="#A9CCE3" stroke="#2980B9" stroke-width="2" rx="5" ry="5"/>
    <text x="565" y="710" font-size="18" text-anchor="middle" font-weight="bold" fill="#1A5276">BVP Signal Extraction</text>
    <text x="565" y="735" font-size="16" text-anchor="middle" fill="#1A5276">(POS Algorithm)</text>

    <rect x="730" y="670" width="250" height="120" fill="#A9CCE3" stroke="#2980B9" stroke-width="2" rx="5" ry="5"/>
    <text x="855" y="710" font-size="18" text-anchor="middle" font-weight="bold" fill="#1A5276">Signal Processing</text>
    <text x="855" y="735" font-size="16" text-anchor="middle" fill="#1A5276">(Filtering &amp; FFT)</text>

    <rect x="440" y="820" width="250" height="110" fill="#AED6F1" stroke="#3498DB" stroke-width="2" rx="5" ry="5"/>
    <text x="565" y="860" font-size="18" text-anchor="middle" font-weight="bold" fill="#154360">Heart Rate Estimation</text>
    <text x="565" y="885" font-size="16" text-anchor="middle" fill="#154360">(HR, HRV, etc.)</text>
    
    <rect x="730" y="820" width="250" height="110" fill="#F5B7B1" stroke="#E74C3C" stroke-width="2" rx="5" ry="5"/>
    <text x="855" y="860" font-size="18" text-anchor="middle" font-weight="bold" fill="#943126">Physiological Credibility</text>
    <text x="855" y="885" font-size="16" text-anchor="middle" fill="#943126">Output: (Pp, Cp, Φ)</text>
  </g>
  
  <!-- Fusion + Output -->
  <g filter="url(#shadow)">
    <rect x="1100" y="420" width="280" height="150" fill="#E8DAEF" stroke="#8E44AD" stroke-width="2.5" rx="8" ry="8"/>
    <text x="1240" y="460" font-size="20" text-anchor="middle" font-weight="bold" fill="#633974">Fusion System</text>
    <text x="1240" y="490" font-size="16" text-anchor="middle" fill="#633974">Confidence-Weighted Integration</text>
    
    <rect x="1450" y="420" width="220" height="150" fill="#FCF3CF" stroke="#F1C40F" stroke-width="2.5" rx="8" ry="8"/>
    <text x="1560" y="470" font-size="20" text-anchor="middle" font-weight="bold" fill="#B7950B">Final Output</text>
    <text x="1560" y="500" font-size="18" text-anchor="middle" fill="#B7950B">Real / Fake</text>
    <text x="1560" y="525" font-size="18" text-anchor="middle" fill="#B7950B">+ Confidence</text>
  </g>

  <!-- Arrows -->
  <path d="M320 475 L420 475" stroke="#444" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="370" y="460" font-size="16" text-anchor="middle">Face Frames</text>

  <path d="M320 495 L420 710" stroke="#444" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <path d="M690 310 L730 310" stroke="#AF601A" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="710" y="295" font-size="14" text-anchor="middle" fill="#AF601A">Feature Vectors</text>

  <path d="M855 390 L855 440" stroke="#AF601A" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="855" y="415" font-size="14" text-anchor="middle" fill="#AF601A">Temporal Features</text>
  
  <path d="M690 710 L730 710" stroke="#2980B9" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="710" y="695" font-size="14" text-anchor="middle" fill="#1A5276">BVP Signal</text>

  <!-- FIXED Filtered Signal arrow + label -->
  <path d="M875 780 L875 820" stroke="#2980B9" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="845" y="800" font-size="14" text-anchor="end" fill="#1A5276">Filtered Signal</text>


  <path d="M690 860 L730 860" stroke="#2980B9" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
 <text x="710" y="845" font-size="14" text-anchor="middle" fill="#1A5276">Heart Rate Data</text>

 <path d="M1000 480 L1100 480" stroke="#444" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
 <path d="M1000 860 L1080 860 L1080 480 L1100 480" stroke="#444" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
 <path d="M1380 495 L1450 495" stroke="#444" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

